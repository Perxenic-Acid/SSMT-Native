name: Publish official SSMT plugins

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  plugin-assets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证原神 Poser 实验插件
        shell: pwsh
        run: |
          cmake -S SSMT-Poser -B build-poser -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-poser --config Release --target SSMT-Poser PoserProbeTests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-poser -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包官方插件和目录
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./tools/pack-official-plugins.ps1 -ReleaseTag $env:RELEASE_TAG
      - name: 上传 Native Release 资产
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist/plugin-release -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets
