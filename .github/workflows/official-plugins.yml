name: Build and publish SSMT Native

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: '操作：仅构建测试，或验证通过后创建全新 GitHub Release'
        required: true
        default: build_only
        type: choice
        options:
          - build_only
          - publish_new_release
      release_tag:
        description: '仅发布新 Release 时必填，例如 v0.1.2（不能使用已存在的标签）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.release_mode == 'publish_new_release' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_TAG: ${{ inputs.release_mode == 'publish_new_release' && inputs.release_tag || format('ci-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验操作模式及新版本标签
        shell: pwsh
        run: |
          if ($env:RELEASE_MODE -eq 'publish_new_release') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw '只能从 main 分支发布正式 Release'
            }
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
              throw '新 Release 标签应为 v主版本.次版本.修订号，例如 v0.1.2'
            }
            # git tag --list 对“不存在”返回成功且输出空列表，避免保留非零 LASTEXITCODE。
            $matchingTags = @(git tag --list "$env:RELEASE_TAG")
            if ($LASTEXITCODE -ne 0) { throw 'Git 标签检查失败' }
            if ($matchingTags.Count -ne 0) { throw "标签已存在：$env:RELEASE_TAG" }
          } elseif ($env:RELEASE_MODE -ne 'build_only') {
            throw "未知操作模式：$env:RELEASE_MODE"
          }
          "Mode: $env:RELEASE_MODE; tag: $env:RELEASE_TAG; sha: $env:GITHUB_SHA" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: 检查插件源码更新是否提升包版本
        if: ${{ inputs.release_mode == 'publish_new_release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # /latest 与客户端发现入口一致；首次发布才允许没有基线。
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'SSMT-Native-Release' } -SkipHttpErrorCheck
          if ([int]$response.StatusCode -eq 404) {
            Write-Host '仓库尚无正式 Release，跳过历史版本比较。'
          } elseif ([int]$response.StatusCode -ne 200) {
            throw "无法读取已发布插件基线：HTTP $($response.StatusCode)"
          } else {
            $baseTag = ($response.Content | ConvertFrom-Json).tag_name
            ./tools/check-plugin-release-versions.ps1 -BaseRef $baseTag
          }
      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建 Rust 工作区并验证插件 ABI
        shell: pwsh
        run: |
          cargo +1.96.0 build --locked --workspace --release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.96.0 run --locked --release -p ssmt-host-probe --bin abi-query -- target/release/ssmt_test_plugin.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建 Native 与 Bridge
        shell: pwsh
        run: |
          cmake -S . -B build-release -A x64 -DSSMT_BUILD_GIMI_BRIDGE=ON -DSSMT_BUILD_POSER_PROBE=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-release --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build-release/SSMT-Player-Tweaks/Release/CameraPolicyTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CameraZoomTests 需要仓库未提供的游戏证据样本，仅构建、不运行。
          'CameraZoomTests: built, not run (external evidence fixtures unavailable).' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Copy-Item target/release/ssmt_plugin_host.dll dist/Release/
      - name: 构建并测试 Poser（正式插件依赖，必须成功）
        shell: pwsh
        run: |
          cmake -S SSMT-Poser -B build-poser -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 构建实际存在的全部目标，避免要求被忽略的本机 Tests/ 源码。
          cmake --build build-poser --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-poser -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 读取固定 OptiScaler 源码版本
        id: optiscaler
        shell: pwsh
        run: |
          $pin = Get-Content tools/sources/optiscaler.json -Raw | ConvertFrom-Json
          if ($pin.repository -cne 'Perxenic-Acid/OptiScaler_DLSSNR' -or $pin.revision -notmatch '^[0-9a-f]{40}$') {
            throw 'OptiScaler 固定来源声明无效'
          }
          "revision=$($pin.revision)" | Out-File $env:GITHUB_OUTPUT -Append
      - name: 读取固定 Secondary Motion 源码版本
        id: secondary-motion
        shell: pwsh
        run: |
          $pin = Get-Content tools/sources/secondary-motion.json -Raw | ConvertFrom-Json
          if ($pin.repository -cne 'Sp1cHless/Arknights-Endfield-Plugin-Secondary-bodyphysics' -or
              $pin.revision -notmatch '^[0-9a-f]{40}$') {
            throw 'Secondary Motion 固定来源声明无效'
          }
          "repository=$($pin.repository)" | Out-File $env:GITHUB_OUTPUT -Append
          "revision=$($pin.revision)" | Out-File $env:GITHUB_OUTPUT -Append
      - name: 验证插件版本隔离与打包完整性
        shell: pwsh
        run: |
          ./tools/tests/test-plugin-release-versions.ps1
          ./tools/tests/test-official-packaging.ps1
      - uses: actions/checkout@v4
        with:
          repository: Perxenic-Acid/OptiScaler_DLSSNR
          ref: ${{ steps.optiscaler.outputs.revision }}
          path: build/optiscaler-source
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.secondary-motion.outputs.repository }}
          ref: ${{ steps.secondary-motion.outputs.revision }}
          path: build/secondary-motion-source
          persist-credentials: false
      - name: 构建 Secondary Motion 注入 DLL
        shell: pwsh
        run: |
          ./tools/build-secondary-motion.ps1 `
            -SourceDirectory ./build/secondary-motion-source `
            -OutputDirectory ./dist/Release
      - name: 构建汉化 OptiScaler 并执行无图形设备回归
        shell: pwsh
        run: ./tools/build-optiscaler.ps1 -SourceDirectory ./build/optiscaler-source
      - name: 筛选获准插件并打包正式发布文件
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PowerShell .ps1 不是原生命令，成功返回后 LASTEXITCODE 可能为 $null。
          # 旧写法 ($LASTEXITCODE -ne 0) 在 $null 时成立，会以 exit $null 静默提前结束打包。
          & ./tools/pack-official-plugins.ps1 -ReleaseTag $env:RELEASE_TAG
          if (-not $?) { throw '官方插件打包脚本执行失败' }
          $assetsDir = 'dist/plugin-release'
          $catalog = Get-Content "$assetsDir/ssmt-plugin-catalog.json" -Raw | ConvertFrom-Json
          $count = @($catalog.entries).Count
          "Approved plugin versions: $count (requires release-status.json publish=true)" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($count -eq 0) {
            throw '没有任何插件进入发布目录：请核对 release-status.json 与打包脚本'
          }
          $packages = @(Get-ChildItem -LiteralPath $assetsDir -Filter '*.ssmtpkg' -File)
          if ($packages.Count -ne $count) {
            throw "插件目录记录数 $count 与包数量 $($packages.Count) 不一致"
          }

          # 核心运行时与可按需下载的独立 .ssmtpkg 插件分开发布；各插件 DLL 在对应包内。
          $coreDir = Join-Path $env:RUNNER_TEMP 'ssmt-native-core'
          New-Item -ItemType Directory -Path $coreDir -Force | Out-Null
          foreach ($filename in @('Run.exe', 'ssmt_plugin_host.dll')) {
            $source = Join-Path 'dist/Release' $filename
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "缺少 Native 核心产物：$source"
            }
            Copy-Item -LiteralPath $source -Destination $coreDir -ErrorAction Stop
          }
          Compress-Archive -Path "$coreDir/*" -DestinationPath "$assetsDir/SSMT-Native-windows-x64.zip"
          # 兼容原 ZIP，同时允许按需下载单个核心文件。
          Copy-Item -LiteralPath (Join-Path $coreDir 'Run.exe') -Destination $assetsDir -ErrorAction Stop
          Copy-Item -LiteralPath (Join-Path $coreDir 'ssmt_plugin_host.dll') -Destination $assetsDir -ErrorAction Stop

          Get-ChildItem -LiteralPath $assetsDir -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content "$assetsDir/SHA256SUMS.txt" -Encoding utf8

          # 校验打包过程真正执行完毕，防止仅上传空插件目录仍被误判为构建成功。
          foreach ($required in @('Run.exe', 'ssmt_plugin_host.dll', 'SSMT-Native-windows-x64.zip', 'ssmt-plugin-catalog.json', 'SHA256SUMS.txt')) {
            $candidate = Join-Path $assetsDir $required
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "正式发布候选文件缺失：$candidate"
            }
            if ((Get-Item -LiteralPath $candidate).Length -eq 0) {
              throw "正式发布候选文件为空：$candidate"
            }
          }
          $releaseFiles = @(Get-ChildItem -LiteralPath $assetsDir -File)
          "Release candidate files: $($releaseFiles.Count)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          $releaseFiles | Sort-Object Name | Format-Table Name,Length -AutoSize

      - name: 保存正式发布候选文件（Actions Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: SSMT-Native-release-assets
          path: dist/plugin-release/
          if-no-files-found: error
          retention-days: 14

      - name: 保存全部编译产物（仅供排错，不取代独立插件包）
        uses: actions/upload-artifact@v4
        with:
          name: SSMT-Native-test-binaries
          path: dist/Release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ inputs.release_mode == 'publish_new_release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SSMT-Native-release-assets
          path: release-assets

      - name: 创建新 Release（成功上传全部资产后才公开）
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Only the main branch can publish releases.' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          # 防止 gh release create 复用已经存在但尚未发布的 tag。
          if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists; refusing to reuse it." >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Could not verify remote tag availability (exit $status)." >&2
              exit "$status"
            fi
          fi

          shopt -s nullglob
          assets=(release-assets/*)
          for required in Run.exe ssmt_plugin_host.dll SSMT-Native-windows-x64.zip ssmt-plugin-catalog.json SHA256SUMS.txt; do
            if [[ ! -s "release-assets/$required" ]]; then
              echo "Missing or empty required release asset: $required" >&2
              exit 1
            fi
          done
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

          # 创建草稿时一并上传完整资产；上传成功后才发布 Release。
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
