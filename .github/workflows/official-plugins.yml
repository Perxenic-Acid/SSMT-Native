name: Build and publish SSMT Native

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: '操作：仅构建测试，或验证通过后创建全新 GitHub Release'
        required: true
        default: build_only
        type: choice
        options:
          - build_only
          - publish_new_release
      release_tag:
        description: '仅发布新 Release 时必填，例如 v0.1.2（不能使用已存在的标签）'
        required: false
        default: ''
        type: string
      build_poser:
        description: '额外构建并测试 Poser，测试产物不会进入正式发布包'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ inputs.release_mode == 'publish_new_release' && inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_MODE: ${{ inputs.release_mode }}
      RELEASE_TAG: ${{ inputs.release_mode == 'publish_new_release' && inputs.release_tag || format('ci-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 校验操作模式及新版本标签
        shell: pwsh
        run: |
          if ($env:RELEASE_MODE -eq 'publish_new_release') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw '只能从 main 分支发布正式 Release'
            }
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
              throw '新 Release 标签应为 v主版本.次版本.修订号，例如 v0.1.2'
            }
            git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -eq 0) { throw "标签已存在：$env:RELEASE_TAG" }
            if ($LASTEXITCODE -ne 1) { throw 'Git 标签检查失败' }
          } elseif ($env:RELEASE_MODE -ne 'build_only') {
            throw "未知操作模式：$env:RELEASE_MODE"
          }
          "Mode: $env:RELEASE_MODE; tag: $env:RELEASE_TAG; sha: $env:GITHUB_SHA" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: 安装 Rust 工具链
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建 Rust 工作区并验证插件 ABI
        shell: pwsh
        run: |
          cargo +1.96.0 build --locked --workspace --release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.96.0 run --locked --release -p ssmt-host-probe --bin abi-query -- target/release/ssmt_test_plugin.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 构建 Native 与 Bridge
        shell: pwsh
        run: |
          cmake -S . -B build-release -A x64 -DSSMT_BUILD_GIMI_BRIDGE=ON -DSSMT_BUILD_POSER_PROBE=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-release --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build-release/SSMT-Player-Tweaks/Release/CameraPolicyTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CameraZoomTests 需要仓库未提供的游戏证据样本，仅构建、不运行。
          'CameraZoomTests: built, not run (external evidence fixtures unavailable).' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Copy-Item target/release/ssmt_plugin_host.dll dist/Release/
      - name: 验证可选 Poser 实验插件
        if: ${{ inputs.build_poser }}
        shell: pwsh
        run: |
          cmake -S SSMT-Poser -B build-poser -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 构建实际存在的全部目标，避免要求被忽略的本机 Tests/ 源码。
          cmake --build build-poser --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-poser -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 打包官方插件和目录
        shell: pwsh
        run: |
          ./tools/pack-official-plugins.ps1 -ReleaseTag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $catalog = Get-Content dist/plugin-release/ssmt-plugin-catalog.json -Raw | ConvertFrom-Json
          $count = @($catalog.entries).Count
          "Plugin catalog entries: $count" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($count -eq 0) {
            Write-Warning '没有可发布插件：请检查 release-status.json。暂缓发布标记不会被覆盖。'
            if ($env:PUBLISH_ASSETS -eq 'true') { throw '拒绝向 Release 上传空插件目录' }
          }
          Compress-Archive -Path dist/Release/* -DestinationPath dist/plugin-release/SSMT-Native-windows-x64.zip
          Get-ChildItem dist/plugin-release -File | Where-Object Name -ne SHA256SUMS.txt | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/plugin-release/SHA256SUMS.txt -Encoding utf8
      - name: 保留构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SSMT-Native-windows-x64
          path: dist/plugin-release/
          if-no-files-found: error
          retention-days: 14

  upload:
    needs: build
    if: ${{ github.event_name == 'release' || inputs.upload_to_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SSMT-Native-windows-x64
          path: release-assets
      - name: 上传到已有 Release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null
          # 不覆盖已有同名资产，避免改变已分发插件的哈希。
          gh release upload "$RELEASE_TAG" release-assets/*
