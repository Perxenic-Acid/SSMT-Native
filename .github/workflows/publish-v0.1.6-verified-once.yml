# 一次性发布：只使用官方工作流已构建、已校验的 39018622290 资产。
# 使用完毕即删除。不会触发新编译，也不会覆盖现有 Release。
name: Publish verified SSMT Native v0.1.6 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.6-verified-once.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-verified:
    if: ${{ github.repository == 'Perxenic-Acid/SSMT-Native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.1.6
      VERIFIED_RUN: '39018622290'
      VERIFIED_COMMIT: d0db86c0e05979cefb3c566e68e2e43ded6e30de
    steps:
      - name: Verify that official build succeeded
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN" --jq '.head_sha')"
          if [[ "$actual_sha" != "$VERIFIED_COMMIT" ]]; then
            echo "Unexpected build source commit: $actual_sha" >&2
            exit 1
          fi
          result="$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN/jobs" --jq '.jobs[] | select(.name == "build") | .conclusion')"
          if [[ "$result" != "success" ]]; then
            echo "Official build did not succeed: $result" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: SSMT-Native-release-assets
          repository: ${{ github.repository }}
          run-id: 39018622290
          github-token: ${{ github.token }}
          path: release-assets

      - name: Publish the verified release with individual plugin assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, refusing overwrite." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists, refusing reuse." >&2
            exit 1
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Cannot verify the tag (git exit $status)." >&2
              exit "$status"
            fi
          fi
          for asset in Run.exe ssmt_plugin_host.dll SSMT-Native-windows-x64.zip ssmt-plugin-catalog.json SHA256SUMS.txt; do
            [[ -s "release-assets/$asset" ]] || { echo "Missing asset: $asset" >&2; exit 1; }
          done
          shopt -s nullglob
          plugins=(release-assets/*.ssmtpkg)
          if [[ "${#plugins[@]}" -ne 7 ]]; then
            echo "Expected 7 independent plugin versions, found ${#plugins[@]}." >&2
            exit 1
          fi
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          assets=(release-assets/*)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$VERIFIED_COMMIT" --title "$RELEASE_TAG" --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
