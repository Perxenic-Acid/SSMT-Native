<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Tweaks</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#151922;color:#e7eaf0}body{max-width:850px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#b8c0d0}fieldset{border:1px solid #39445b;border-radius:10px;margin:20px 0;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}legend{padding:0 8px}label{display:flex;align-items:center;gap:10px}input[type=number]{width:80px;margin-left:auto;padding:7px;color:inherit;background:#222b3a;border:1px solid #556783;border-radius:5px}input[type=checkbox]{accent-color:#90b9ff;width:18px;height:18px}button{padding:10px 24px;border:0;border-radius:7px;color:#101928;background:#90b9ff;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}#status.error{color:#ffb6b6}
</style>
<h1>Player Tweaks</h1><p>设置在下一次游戏启动时应用。</p>
<form id="settings"><div id="fields"></div><button id="save" disabled>保存设置</button></form><p id="status" role="status">正在读取设置…</p>
<script type="module">
let sequence=0;const pending=new Map();
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='ssmt:capability-response'||event.data.protocolVersion!==1)return;const task=pending.get(event.data.requestId);if(!task)return;clearTimeout(task.timer);pending.delete(event.data.requestId);event.data.ok?task.resolve(event.data.value):task.reject(Error(event.data.errorMessage||'插件调用失败'))});
function capability(capability,payload){return new Promise((resolve,reject)=>{const requestId=`player-tweaks-${++sequence}`;const timer=setTimeout(()=>{pending.delete(requestId);reject(Error('宿主响应超时'))},125000);pending.set(requestId,{resolve,reject,timer});parent.postMessage({type:'ssmt:capability-request',protocolVersion:1,requestId,capability,payload},'*')})}
const call=(method,payload=null)=>capability('plugin.backend.request',{method,payload});
const labels={customFov:'自定义视野',fov:'视野角度',preserveAimingFov:'保留瞄准视野',preserveCutsceneFov:'保留过场视野',restoreInUi:'界面中还原视野',transitionSpeed:'过渡速度',disableInputSmoothing:'关闭输入平滑',disableTransitionBlend:'关闭过渡混合',disableCharacterFade:'关闭角色淡出',disableEventCameraMovement:'关闭事件镜头移动',cameraZoom:'自由镜头距离',fpsUnlock:'启用帧率解锁',targetFps:'目标帧率',fastTeamPage:'快速队伍界面'};
const bounds={fov:[30,120,.1],transitionSpeed:[0,30,.1],targetFps:[30,240,1]};
const status=document.getElementById('status'),button=document.getElementById('save'),form=document.getElementById('settings');let value;
function message(text,error=false){status.textContent=text;status.classList.toggle('error',error)}
try{const context=await capability('game.context.read',{});value=await call('settings.read');for(const section of ['camera','gameplay']){if(context.gamePreset==='SRMI'&&section==='camera')continue;const fieldset=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=section==='camera'?'镜头设置':'游戏设置';fieldset.append(legend);for(const [key,setting]of Object.entries(value[section])){if(context.gamePreset==='SRMI'&&key!=='fpsUnlock')continue;const label=document.createElement('label'),input=document.createElement('input');input.type=typeof setting==='boolean'?'checkbox':'number';if(input.type==='checkbox')input.checked=setting;else{input.value=setting;[input.min,input.max,input.step]=bounds[key]}input.addEventListener('input',()=>value[section][key]=input.type==='checkbox'?input.checked:Number(input.value));label.append(input,document.createTextNode(labels[key]||key));fieldset.append(label)}document.getElementById('fields').append(fieldset)}button.disabled=false;message(context.gamePreset==='SRMI'?'崩铁使用 120 FPS；停用插件时恢复原有帧率设置。':'')}catch(error){message(String(error),true)}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;try{value=await call('settings.save',value);message('设置已保存，下次启动游戏时生效。')}catch(error){message(String(error),true)}finally{button.disabled=false}});
</script></html>
